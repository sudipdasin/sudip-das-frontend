
version: 2.1

jobs:
  validate-frontend:
    docker:
      - image: cimg/node:22.14
    resource_class: small
    steps:
      - checkout
      - run:
          name: Validate required frontend files
          command: |
            test -s index.html
            test -s languages.js
      - run:
          name: Check JavaScript syntax
          command: |
            node --check languages.js
      - run:
          name: Check HTML structure
          command: |
            python3 - <<'PY'
            from html.parser import HTMLParser
            from pathlib import Path

            class Parser(HTMLParser):
                pass

            parser = Parser()
            parser.feed(
                Path("index.html").read_text(
                    encoding="utf-8"
                )
            )
            parser.close()
            print("HTML parsing completed")
            PY

workflows:
  frontend-checks:
    jobs:
      - validate-frontend
