# Install in PRIVATE sudipdasin/webstudio-private at
# .github/workflows/webstudio-release-to-public.yml.
# Automatic publishing is OFF until WEBSTUDIO_AUTO_PUBLISH=true is set
# in the private repository after cutover. Manual dispatch is explicit.
name: Verify and publish WebStudio artifact
on:
  push:
    branches: [main]
    paths:
      - "examples/customer-demo/**"
      - "scripts/build-customer-demo.mjs"
      - "scripts/verify-customer-demo.mjs"
      - "tests/**"
      - "browser-tests/**"
      - ".github/workflows/webstudio-release-to-public.yml"
  workflow_dispatch:
    inputs:
      publish:
        description: "Explicitly authorize publication of tested browser assets"
        type: boolean
        required: true
        default: false
permissions:
  contents: read
concurrency:
  group: webstudio-private-to-public-artifacts
  cancel-in-progress: false
jobs:
  validate:
    if: (github.event_name == 'workflow_dispatch' && inputs.publish == true) || (github.event_name == 'push' && vars.WEBSTUDIO_AUTO_PUBLISH == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify core source and archive security tests
        run: |
          node --check scripts/build-customer-demo.mjs
          node --test tests/*.test.mjs
      - name: Install Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Validate functional WebStudio in real browser
        run: node browser-tests/customer-demo.mjs
      - name: Build and reject sensitive deployment artifacts
        run: |
          node scripts/build-customer-demo.mjs
          node scripts/verify-customer-demo.mjs
          test -s dist/customer-demo-preview/index.html
          test -s dist/customer-demo-preview/app.js
          test ! -e dist/customer-demo-preview/.env
          test ! -e dist/customer-demo-preview/wrangler.toml
      - uses: actions/upload-artifact@v4
        with:
          name: verified-webstudio-public-site
          path: dist/customer-demo-preview/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
  publish:
    if: (github.event_name == 'workflow_dispatch' && inputs.publish == true) || (github.event_name == 'push' && vars.WEBSTUDIO_AUTO_PUBLISH == 'true')
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: webstudio-public-publish
    steps:
      - name: Verify release token is available
        env:
          PUBLIC_DEPLOY_TOKEN: ${{ secrets.PUBLIC_DEPLOY_TOKEN }}
        run: |
          test -n "$PUBLIC_DEPLOY_TOKEN" || {
            echo "Missing private secret PUBLIC_DEPLOY_TOKEN" >&2; exit 1;
          }
      - uses: actions/checkout@v4
        with:
          path: private-source
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: verified-webstudio-public-site
          path: site-build
      - name: Verify downloaded artifact again
        run: |
          node private-source/scripts/verify-customer-demo.mjs site-build
      - uses: actions/checkout@v4
        with:
          repository: sudipdasin/sudip-das-frontend
          ref: main
          token: ${{ secrets.PUBLIC_DEPLOY_TOKEN }}
          path: public-repo
          persist-credentials: true
      - name: Replace PUBLIC WebStudio assets only
        shell: bash
        run: |
          set -Eeuo pipefail
          test ! -L public-repo/public-pages
          test -s site-build/index.html
          test -s site-build/webstudio-runtime-manifest.json
          rm -rf public-repo/public-pages
          mkdir -p public-repo/public-pages
          cp -a site-build/. public-repo/public-pages/
          node private-source/scripts/verify-customer-demo.mjs public-repo/public-pages
          git -C public-repo add -A -- public-pages
          # Never commit changes outside the isolated deployment directory.
          while IFS= read -r path; do
            case "$path" in
              public-pages/*) ;;
              *) echo "Forbidden public change: $path" >&2; exit 1 ;;
            esac
          done < <(git -C public-repo diff --cached --name-only)
          if ! git -C public-repo diff --cached --quiet; then
            git -C public-repo -c user.name="WebStudio release bot" \
              -c user.email="webstudio-release@users.noreply.github.com" \
              commit -m "deploy(webstudio): verified public assets from private source"
            git -C public-repo push origin HEAD:main
          fi
          echo "Only public-pages/ may have changed; portfolio root is untouched."
