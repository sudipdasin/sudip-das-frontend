<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" role="img" aria-labelledby="title desc">
<title id="title">WebStudio illustrative interface</title>
<desc id="desc">Concept illustration of a website design experience. Not a live editor or screenshot.</desc>
<defs>
