name: Package DevDas WebStudio demo
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/package-webstudio-demo.mjs'
      - 'scripts/build-personalized-preview.mjs'
      - 'tests/personalized-preview.test.mjs'
      - 'tests/avatar-studio.test.mjs'
      - 'tests/customer-demo-build.test.mjs'
      - 'examples/customer-demo/studio-avatar.js'
      - 'examples/customer-demo/studio-avatar.css'
      - 'examples/customer-demo/studio-creative-avatar.svg'
      - 'examples/customer-demo/index.html'
      - 'scripts/build-customer-demo.mjs'
      - 'tests/webstudio-package.test.mjs'
      - '.github/workflows/webstudio-demo-package.yml'
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run automated checks
        run: |
          node --check scripts/package-webstudio-demo.mjs
          node --check scripts/build-personalized-preview.mjs
          node --check examples/customer-demo/studio-avatar.js
          node --test tests/*.test.mjs
      - name: Build standalone fictional demo ZIP
        run: node scripts/package-webstudio-demo.mjs
      - name: Verify archive contents
        run: |
          unzip -t dist/DevDas-WebStudio-demo.zip
          unzip -Z1 dist/DevDas-WebStudio-demo.zip | grep -Fx site/index.html
          unzip -Z1 dist/DevDas-WebStudio-demo.zip | grep -Fx SHA256SUMS.txt
      - name: Upload downloadable prototype artifact
        uses: actions/upload-artifact@v4
        with:
          name: DevDas-WebStudio-demo
          path: dist/DevDas-WebStudio-demo.zip
          if-no-files-found: error
          retention-days: 30
