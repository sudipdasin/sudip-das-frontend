name: Publish fictional customer demo preview
on:
  push:
    branches: [main]
    paths:
      - 'examples/customer-demo/**'
      - 'scripts/build-customer-demo.mjs'
      - 'scripts/verify-customer-demo.mjs'
      - 'contracts/personal-port-v1.json'
      - 'tests/personal-port-contract.test.mjs'
      - 'tests/customer-demo*.test.mjs'
      - 'tests/avatar-studio.test.mjs'
      - 'browser-tests/customer-demo.mjs'
      - 'tests/webstudio-freemium.test.mjs'
      - '.github/workflows/customer-demo-pages.yml'
  pull_request:
    paths:
      - 'examples/customer-demo/**'
      - 'scripts/build-customer-demo.mjs'
      - 'scripts/verify-customer-demo.mjs'
      - 'contracts/personal-port-v1.json'
      - 'tests/personal-port-contract.test.mjs'
      - 'tests/customer-demo*.test.mjs'
      - 'browser-tests/customer-demo.mjs'
      - 'tests/webstudio-freemium.test.mjs'
      - '.github/workflows/customer-demo-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: customer-demo-github-pages-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'production' }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and validate isolated preview
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test fictional customer demo
        run: |
          node --check examples/customer-demo/app.js
          node --check examples/customer-demo/studio-avatar.js
          node --check examples/customer-demo/premium.js
          node --check examples/customer-demo/studio-features.js
          node --check examples/customer-demo/studio-tour.js
          node --check examples/customer-demo/studio-i18n.js
          node --check examples/customer-demo/studio-ownership.js
          node --check examples/customer-demo/studio-system-menu.js
          node --check examples/customer-demo/studio-reference-layout.js
          node --check examples/customer-demo/studio-design-two.js
          node --check examples/customer-demo/studio-desktop-reference.js
          node --check examples/customer-demo/studio-email.js
          node --check examples/customer-demo/commerce.js
          node --check scripts/build-customer-demo.mjs
          node --test tests/customer-demo.test.mjs tests/customer-demo-build.test.mjs tests/demo-i18n.test.mjs tests/avatar-studio.test.mjs tests/personal-port-contract.test.mjs tests/webstudio-freemium.test.mjs
      - name: Install headless Chromium for real browser tests
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify wizard in Chromium
        run: node browser-tests/customer-demo.mjs
      - name: Upload desktop and mobile visual audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neon-visual-audit-${{ github.run_id }}
          path: dist/visual-audit/
          if-no-files-found: ignore
          retention-days: 14
      - name: Produce isolated Pages artifact
        run: node scripts/build-customer-demo.mjs
      - name: Verify built preview and inspect for accidental secrets
        run: node scripts/verify-customer-demo.mjs
      - name: Upload deployment artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/customer-demo-preview

  deploy:
    name: Deploy GitHub Pages preview
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Prepare GitHub Pages
        uses: actions/configure-pages@v5
      - name: Deploy isolated demo
        id: deployment
        uses: actions/deploy-pages@v4
