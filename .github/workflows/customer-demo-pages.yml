# Only activate AFTER private-source build has populated public-pages/
# and a backup of the existing public Pages workflow is verified.
# Replace .github/workflows/customer-demo-pages.yml with this file.
name: Deploy reviewed WebStudio public build
on:
  push:
    branches: [main]
    paths:
      - "public-pages/**"
      - ".github/workflows/customer-demo-pages.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: webstudio-public-artifact-deploy
  cancel-in-progress: false
jobs:
  verify:
    name: Verify public-only WebStudio Pages artifact
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check artifact and preserve personal Cloudflare site
        shell: bash
        run: |
          set -Eeuo pipefail
          test -s public-pages/index.html
          test -s public-pages/app.js
          test -s public-pages/profile.json
          test -s public-pages/webstudio-runtime-manifest.json
          test -s index.html
          test -s languages.js
          test -s scripts/repo-discovery.js
          test -s sudip-das-portrait.jpg
          test ! -L public-pages
          node --check public-pages/app.js
          node --check scripts/repo-discovery.js
          node <<'NODE'
          const fs=require('node:fs'),path=require('node:path');
          const dir='public-pages';
          const manifest=JSON.parse(fs.readFileSync(path.join(dir,'webstudio-runtime-manifest.json'),'utf8'));
          const profile=JSON.parse(fs.readFileSync(path.join(dir,'profile.json'),'utf8'));
          if(manifest.schemaVersion!==1||!Array.isArray(manifest.files)||manifest.files.length<40||
             profile.demo!==true||profile.identity?.displayName!=='Dev Das')
            throw Error('Invalid isolated fictional WebStudio artifact');
          const reserved=/(^|\/)(private|secrets|node_modules|backups)(\/|$)|\.map$|\.(env|pem|key|p12|db|sqlite)$/i;
          for(const name of manifest.files){
            if(!/^[a-z0-9][a-z0-9._-]*$/i.test(name)||reserved.test(name)||
               !fs.statSync(path.join(dir,name)).isFile())
              throw Error('Missing/unsafe published WebStudio asset: '+name);
          }
          const files=fs.readdirSync(dir);
          for(const name of files){
            if(reserved.test(name)||fs.lstatSync(path.join(dir,name)).isSymbolicLink())
              throw Error('Unexpected file in Pages deployment: '+name);
          }
          console.log('Public-only WebStudio build accepted: '+manifest.files.length+' client files');
          NODE
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public-pages
  deploy:
    name: Deploy existing GitHub Pages destination
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
