name: Public frontend validation
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: node --check languages.js
      - name: Verify domain cutover checker
        run: |
          node --check scripts/site-readiness.mjs
          node --check scripts/repo-discovery.js
          node --check examples/customer-demo/app.js
          node --check examples/customer-demo/premium.js
          node --check examples/customer-demo/studio-features.js
          node --check examples/customer-demo/studio-tour.js
          node --check examples/customer-demo/studio-i18n.js
          node --check examples/customer-demo/commerce.js
          node --check scripts/build-customer-demo.mjs
          node --test tests/*.test.mjs
      - name: Ensure expected public assets exist
        run: |
          test -s index.html
          test -s languages.js
          test -s sudip-das-portrait.jpg
          test -s data/site.json
          test -s data/site.xml
          test -s scripts/repo-discovery.js
          test -s _headers
          test -s 404.html
          test -s examples/customer-demo/index.html
          test -s examples/customer-demo/profile.json
          test -s examples/customer-demo/app.js
          test -s examples/customer-demo/premium.css
          test -s examples/customer-demo/premium.js
          test -s examples/customer-demo/studio-features.js
          test -s examples/customer-demo/studio-features.css
          test -s examples/customer-demo/illustrated-developer.svg
          test -s examples/customer-demo/studio-polish.css
          test -s examples/customer-demo/studio-tour.js
          test -s examples/customer-demo/commerce.js
          test -s examples/customer-demo/commerce.json
          test -s examples/customer-demo/studio-i18n.js
          test -s examples/customer-demo/i18n-product.json
          test -s examples/customer-demo/i18n-ui.json
          test -s examples/customer-demo/i18n-copy.json
          test -s examples/customer-demo/i18n-profile.json
          test -s examples/customer-demo/i18n-dynamic.json
          test -s examples/customer-demo/studio-product.css
          grep -qi '<html' index.html
