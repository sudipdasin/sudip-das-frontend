name: Diagnose deployed Neon Studio preview
on:
  push:
    branches: [preview-personalweb]
    paths:
      - index.html
      - webstudio-parity.js
      - neon-studio-reference-lock-v1.css
      - .github/workflows/verify-neon-live-preview.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deployment-parity:
    name: Diagnose exact live Cloudflare preview version
    if: github.ref == 'refs/heads/preview-personalweb'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read live HTML and independently request the expected two assets
        shell: bash
        env:
          SITE: https://preview-personalweb.sudip-das-frontend.pages.dev
          CF_ACCESS_ID: ${{ secrets.CF_ACCESS_CLIENT_ID || secrets.CLOUDFLARE_ACCESS_CLIENT_ID }}
          CF_ACCESS_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET || secrets.CLOUDFLARE_ACCESS_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          stamp="${GITHUB_SHA:0:12}"
          html="$(mktemp)"; css="$(mktemp)"; js="$(mktemp)"
          trap 'rm -f "$html" "$css" "$js"' EXIT
          get_status() {
            local url="$1" file="$2"
            local headers=(--header 'Cache-Control: no-cache')
            # Optional, GitHub-stored Cloudflare Access service-token headers.
            # Do not print tokens; keep the current Access protection enabled.
            if [[ -n "$CF_ACCESS_ID" && -n "$CF_ACCESS_SECRET" ]]; then
              headers+=(--header "CF-Access-Client-Id: $CF_ACCESS_ID" \
                        --header "CF-Access-Client-Secret: $CF_ACCESS_SECRET")
            fi
            curl -sSL --max-time 20 "${headers[@]}" \
              --output "$file" --write-out '%{http_code}' "$url" || echo "NETWORK_ERROR"
          }
          html_status="$(get_status "$SITE/?neon_diag=$stamp" "$html")"
          css_status="$(get_status "$SITE/neon-studio-reference-lock-v1.css?v=1.2.0&neon_diag=$stamp" "$css")"
          js_status="$(get_status "$SITE/webstudio-parity.js?v=neon-1.2.0&neon_diag=$stamp" "$js")"
          echo "Preview entry HTTP: $html_status / CSS: $css_status / JS: $js_status"
          echo "HTML bytes: $(wc -c < "$html") / CSS bytes: $(wc -c < "$css") / JS bytes: $(wc -c < "$js")"
          echo "Live page's currently referenced Neon and WebStudio assets:"
          grep -oE 'neon-studio-reference-lock-v1\.css[^" ]*|webstudio-parity\.js[^" ]*' "$html" | head -8 || true
          echo "Live document title:"
          grep -oE '<title>[^<]+' "$html" | head -1 || true
          if grep -Eq '<title>Sign in[^<]*Cloudflare Access' "$html"; then
            echo '::error::Cloudflare Access protects this preview. The test received the sign-in page, not the portfolio. An authenticated preview can still be correct; NO stale-build claim is justified.'
            echo '::notice::To validate a protected preview automatically, configure repository secrets CF_ACCESS_CLIENT_ID and CF_ACCESS_CLIENT_SECRET for a scoped Cloudflare Access service token.'
            exit 1
          fi
          pass=1
          if [ "$html_status" != 200 ]; then
            echo "::error::Cloudflare preview root did not respond HTTP 200"
            pass=0
          fi
          for marker in \
              'neon-studio-reference-lock-v1.css?v=1.2.0' \
              'webstudio-parity.js?v=neon-1.2.0' \
              'PORTFOLIO_PREVIEW_MODE=true'; do
            if grep -Fq "$marker" "$html"; then echo "PASS HTML marker: $marker"
            else echo "::error::MISSING in deployed HTML: $marker";pass=0;fi
          done
          if [ "$css_status" = 200 ] && grep -Fq 'body.ws-parity[data-theme="neon-studio"] .ws-utility' "$css";then
            echo 'PASS live CSS: Neon Studio top status strip is removed'
          else echo '::error::Expected Neon CSS is missing/unavailable';pass=0;fi
          if [ "$js_status" = 200 ] && grep -Fq 'syncNeonRing' "$js";then
            echo 'PASS live JS: Concentric geometry implementation is present'
          else echo '::error::Expected Neon JS is missing/unavailable';pass=0;fi
          if [ "$pass" -ne 1 ];then
            echo "::error::Cloudflare preview build differs from GitHub preview-personalweb. Restore/redeploy branch preview — not main."
            exit 1
          fi
          echo 'PASS: Cloudflare is serving the correct Neon Studio preview'
