# Public artifact-only validation. Development source remains PRIVATE.
# CircleCI is the primary CI provider; no deployment or paid action is invoked.
version: 2.1

jobs:
  public-artifact-integrity:
    docker:
      - image: cimg/node:22.14
    resource_class: small
    steps:
      - checkout
      - run:
          name: Check approved personal portfolio and prohibit development source
          command: |
            set -eu
            test -s index.html
            test -s languages.js
            test -s webstudio-visual-port.css
            test -s webstudio-visual-port.js
            test -s webstudio-portfolio-gallery.js
            test -s webstudio-visitor-hub.js
            test -s sudip-das-portrait.jpg
            test -s data/profile.json
            test -s site-release.json
            node --check languages.js
            node --check webstudio-visual-port.js
            node --check webstudio-portfolio-gallery.js
            node --check webstudio-visitor-hub.js
            node --check scripts/repo-discovery.js
            node --check webstudio-parity.js
            node --check scripts/verify-six-theme-fidelity.mjs
            node scripts/verify-six-theme-fidelity.mjs
            node --check scripts/verify-aurora-reference-v2.mjs
            node --check scripts/verify-editorial-visual.mjs
            node --check scripts/verify-theme-contract.mjs
            node scripts/verify-theme-contract.mjs
            node --check personal-theme-library.js
            node --check scripts/verify-personal-theme-library.mjs
            node scripts/verify-personal-theme-library.mjs
            node --check webstudio-footer.js
            node --check functions/api/webstudio-interest.js
            node --check scripts/verify-editorial-webstudio-footer.mjs
            node scripts/verify-editorial-webstudio-footer.mjs
            node --check scripts/verify-foundation-redesign.mjs
            node scripts/verify-foundation-redesign.mjs
            node scripts/verify-aurora-reference-v2.mjs
            # A CSS geometry unit contract complements full Chromium checks.
            node <<'JS'
            const fs=require('node:fs');
            const assert=require('node:assert/strict');
            for(const path of ['examples','tests','browser-tests','services','workers','backups','contracts','migration','content','site','dist']){
              assert.equal(fs.existsSync(path),false,'Development/private source in public artifact: '+path);
            }
            const html=fs.readFileSync('index.html','utf8');
            for(const key of ['Sudip Das','id="private-request-form"','webstudio-parity.js','webstudio-portfolio-gallery.js','webstudio-visitor-hub.js']){
              assert.ok(html.includes(key),'Missing personal site feature: '+key);
            }
            assert.ok(!html.includes('__PUBLIC_')&&!html.includes('__TURNSTILE_SITE_KEY__'),'Unresolved build placeholder');
            assert.ok(!html.includes('Dev Das portrait'),'Fictional buyer identity leaked into real portfolio');
            const release=JSON.parse(fs.readFileSync('site-release.json','utf8'));
            if(release.stage==='preview'){
              assert.equal(release.preview?.branch,'preview-personalweb');
              assert.equal(release.preview?.privateRequestsEnabled,false);
              assert.equal(release.preview?.productionApiConnected,false);
              assert.ok(html.includes('window.PORTFOLIO_PREVIEW_MODE=true'),'Preview guard missing');
              assert.ok(html.includes('window.PUBLIC_API_BASE=""'),'Preview must not configure the live Worker');
              assert.ok(html.includes('type="submit" disabled aria-disabled="true"'),'Preview request submit must be disabled');
              assert.doesNotMatch(html,/sudip-das-profile-api\.sudipdasin\.workers\.dev/,'Preview leaks production API URL');
              const parity=fs.readFileSync('webstudio-parity.js','utf8');
              assert.ok(parity.includes('CURRENT PERSONAL PREVIEW'),'Preview visual label missing');
              assert.ok(!html.includes('src="webstudio-visual-port.js"'),'Visitor must not load advanced appearance editor');
              assert.ok(html.includes('src="webstudio-parity.js"'),'Visitor visual runtime must be loaded');
              for(const forbidden of ['ws-studio-open','ws-studio-panel','profile-look-open','profile-shortcuts-open','data-import-look','data-export-look','localStorage','fetch(']){
                assert.ok(!parity.includes(forbidden),'Forbidden visitor mutation/editor control in parity runtime: '+forbidden);
              }
              assert.ok(!parity.includes('Studio & system'),'Unauthorized public studio UI reintroduced');
              assert.ok(parity.includes('ws-visitor-quick-open'),'Safe visitor Quick Actions missing');
              assert.ok(parity.includes('ws-visitor-quick-panel'),'Safe visitor section/theme panel missing');
              assert.ok(parity.includes("themeSelect.dispatchEvent(new Event('change'"),'Quick theme change missing');
              for(const section of ['about','projects','experience','capabilities','contact']){
                assert.ok(parity.includes("'"+section+"'"),'Quick link missing: '+section);
              }


              assert.ok(!parity.includes('Real projects · Six design experiences · No account required'),'Demo banner reappeared');
            } else {
              assert.ok(html.includes('https://sudip-das-profile-api.sudipdasin.workers.dev'),'Production request API endpoint missing');
            }
            assert.equal(release.privateBackendBundled,false);
            const profile=JSON.parse(fs.readFileSync('data/profile.json','utf8'));
            assert.equal(profile.schemaVersion,1);
            assert.deepEqual(profile.identity,{});
            assert.deepEqual(profile.contact,{});
            assert.deepEqual(profile.experience,[]);
            const sensitive=/-----BEGIN (?:RSA |OPENSSH )?PRIVATE KEY-----|\b(?:ghp_|github_pat_)[A-Za-z0-9_]{20,}|\bsk_live_[A-Za-z0-9]{16,}/;
            const fswalk=(dir)=>{for(const entry of fs.readdirSync(dir,{withFileTypes:true})){
              const p=require('node:path').join(dir,entry.name);
              if(entry.isSymbolicLink())throw Error('Symlink in public artifact '+p);
              if(entry.isDirectory())fswalk(p);
              else if(/\.(html|js|json|css|svg|yml|yaml|xml|txt)$/i.test(p)){
                assert.equal(sensitive.test(fs.readFileSync(p,'utf8')),false,'Potential secret '+p);
              }
            }};
            fswalk('.');
            console.log('PASS: Personal site public-only artifact, approved identity and backend isolation');
            JS

  browser-smoke:
    docker:
      - image: mcr.microsoft.com/playwright:v1.56.1-noble
    resource_class: medium
    steps:
      - checkout
      - run:
          name: Install pinned browser client
          command: |
            npm install --no-save --no-package-lock playwright@1.56.1
      - run:
          name: Real Chromium personal portfolio smoke across desktop and mobile
          no_output_timeout: 8m
          command: |
            set -eu
            python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/public-personal-http.log 2>&1 &
            node --input-type=module <<'JS'
            import assert from 'node:assert/strict';
            import {chromium} from 'playwright';
            const browser=await chromium.launch({headless:true,args:['--no-sandbox']});
            try{
              for(const width of [1833,1777,1672,1440,820,390]){
                const page=await browser.newPage({viewport:{width,height:900}});
                try{
                  const r=await page.goto('http://127.0.0.1:8765/',{waitUntil:'domcontentloaded'});
                  assert.ok(r?.ok(),'Local static root unavailable');
                  await page.locator('.ws-utility-right').waitFor({timeout:15000});
                  assert.equal(await page.locator('#ws-studio-open').count(),0,'Studio button publicly visible');
                  assert.equal(await page.locator('#profile-look-open').count(),0,'Appearance button publicly visible');
                  assert.equal(await page.locator('#profile-shortcuts-open').count(),0,'Advanced quick editor must not be visible');
                  assert.equal(await page.locator('#ws-visitor-quick-open').count(),1,'Visitor quick actions missing');
                  await page.locator('#ws-visitor-quick-open').click();
                  assert.equal(await page.locator('#ws-visitor-quick-open').getAttribute('aria-expanded'),'true');
                  assert.equal(await page.locator('#ws-visitor-quick-panel a[href="#projects"]').count(),1);
                  await page.locator('#ws-visitor-quick-panel button[data-theme="design-2"]').click();
                  assert.equal(await page.locator('body').getAttribute('data-theme'),'design-2');
                  assert.equal(await page.locator('#ws-visitor-quick-open').getAttribute('aria-expanded'),'false');
                  assert.equal(await page.locator('#profile-look-dialog').count(),0,'Appearance dialog publicly available');
                  assert.equal(await page.locator('#ws-studio-panel').count(),0,'Studio dialog publicly available');
                  assert.equal(await page.locator('#theme-select option').count(),6);
                  assert.equal(await page.locator('#language-select option').count(),10);
                  assert.equal(await page.locator('#private-request-form').count(),1);
                  assert.equal(await page.locator('#profile-showcase').count(),1);
                  assert.equal(await page.locator('#ws-visitor-hub').count(),1);
                  await page.locator('#theme-select').selectOption('design-2');
                  assert.equal(await page.locator('body').getAttribute('data-theme'),'design-2');
                  // 6-theme × 3-width geometry and permission matrix
                  for(const theme of ['orbit','editorial','terminal','aurora-peak','neon-studio','design-2']){
                    await page.locator('#theme-select').selectOption(theme);
                    assert.equal(await page.locator('body').getAttribute('data-theme'),theme);
                    await page.locator('.hero-art .ws-orbit-chip').first().waitFor();
                    const expectedBadges=theme==='neon-studio'?5:theme==='design-2'?4:3;
                    assert.equal(await page.locator('.hero-art .ws-orbit-chip').count(),expectedBadges,'Orbit badges '+theme+'/'+width);
                    const aurora=page.locator('.ws-aurora-reference');
                    if(theme==='neon-studio'){
                      assert.equal(await aurora.count(),1,'Aurora section must exist in Neon Studio');
                      assert.ok(await aurora.isVisible(),'Aurora reference section not visible');
                      assert.equal(await page.locator('.ws-aurora-info-band').count(),1,'Design 1 information band missing');
                      assert.equal(await page.locator('.ws-aurora-band-details .ws-aurora-mini-detail').count(),4,'Four detail items expected');
                      assert.equal(await page.locator('.ws-aurora-feature-grid .ws-aurora-feature').count(),6,'Design 1 requires six compact cards');
                      assert.equal(await page.locator('.ws-aurora-cta-actions a').count(),3,'Aurora visitor CTA group missing');
                      assert.equal(await page.locator('.hero-art .ws-orbit-chip .ws-orbit-glyph').count(),5,'Five icon medallions expected');
                      assert.equal(await page.locator('.hero-art .ws-orbit-chip .ws-orbit-label').count(),5,'Five skill labels expected');
                      assert.equal(await page.locator('main>.ticker').isVisible(),false,'Old ticker should not duplicate Aurora section');
                      const bandBox=await page.locator('.ws-aurora-info-band').boundingBox();
                      const heroBox=await page.locator('.hero').boundingBox();
                      assert.ok(bandBox&&heroBox&&bandBox.y>=heroBox.y+heroBox.height-4,'Aurora information band must follow hero');
                    } else {
                      assert.equal(await aurora.count(),0,'Aurora must not be in other five theme DOMs: '+theme);
                    }

                    assert.equal(await page.locator('#ws-studio-open').count(),0,'Studio leak '+theme);
                    assert.equal(await page.locator('#profile-look-open').count(),0,'Appearance leak '+theme);
                    assert.equal(await page.locator('#pv-theme-library').count(),1,'Visitor Theme Library missing '+theme);
                    assert.equal(await page.locator('#pv-theme-library').isVisible(),false,'Theme dialog must be hidden by default '+theme);
                    assert.equal(await page.locator('#pv-theme-launch').count(),1,'Theme Library launch action missing '+theme);
                    assert.equal(await page.locator('#ws-interest-toggle').count(),1,'WebStudio footer interest action missing '+theme);
                    assert.equal(await page.locator('#ws-interest-expander').getAttribute('data-open'),'false','Footer interest form must start collapsed '+theme);
                    assert.equal(await page.locator('#ws-interest-email').getAttribute('type'),'email','Only an email address is requested '+theme);
                    assert.equal(await page.locator('a[href*="sudipdasin.github.io/sudip-das-frontend"]').count(),0,'No external WebStudio demo link allowed '+theme);
                    assert.equal(await page.locator('#ws-inline-demo').count(),1,'In-page WebStudio demo missing '+theme);
                    assert.equal(await page.locator('[data-demo-tab]').count(),3,'Three demonstration chapters expected '+theme);
                    assert.equal(await page.locator('#ws-demo-jump').getAttribute('aria-expanded'),'false','WebStudio demo must start closed '+theme);
                    assert.equal(await page.locator('#ws-inline-demo').getAttribute('data-open'),'false','WebStudio showcase should start collapsed '+theme);
                    assert.equal(await page.locator('#ws-inline-demo').getAttribute('aria-hidden'),'true','Collapsed demo must be hidden from assistive tech '+theme);
                    assert.equal(await page.locator('#ws-inline-demo').evaluate(el=>el.inert),true,'Collapsed demo must not be keyboard-focusable '+theme);
                    assert.equal(await page.locator('.ws-demo-panel:visible').count(),0,'Collapsed WebStudio images must be hidden '+theme);
                    assert.equal(await page.locator('#experience .foundation-summary').count(),1,'Foundation right panel not present '+theme);
                    assert.equal(await page.locator('#experience .foundation-pillar-list li').count(),3,'Three grounded experience pillars expected '+theme);
                    assert.equal(await page.locator('#experience .foundation-country').innerText(),'Based in India','Only public country should appear '+theme);
                    assert.equal(await page.locator('#experience .work-grid h3').filter({hasText:'Address'}).count(),0,'Misleading Address heading persists '+theme);
                    if(theme==='editorial'){
                      await page.locator('#experience').scrollIntoViewIfNeeded();
                      const foundation=await page.evaluate(()=>{
                        const [left,right]=document.querySelectorAll('#experience .work-grid > *');
                        const a=left.getBoundingClientRect(),b=right.getBoundingClientRect();
                        const paper=getComputedStyle(right).backgroundColor;
                        const fg=getComputedStyle(right.querySelector('h3')).color;
                        const luminance=css=>{
                          const rgb=css.match(/\d+(?:\.\d+)?/g).slice(0,3).map(x=>Number(x)/255);
                          const linear=rgb.map(x=>x<=.04045?x/12.92:((x+.055)/1.055)**2.4);
                          return .2126*linear[0]+.7152*linear[1]+.0722*linear[2];
                        };
                        return {left:{x:a.x,y:a.y,w:a.width,h:a.height},right:{x:b.x,y:b.y,w:b.width,h:b.height},
                          contrast:(Math.max(luminance(paper),luminance(fg))+.05)/(Math.min(luminance(paper),luminance(fg))+.05),
                          position:getComputedStyle(left).position,
                          background:paper,
                          scrollWidth:document.querySelector('#experience').scrollWidth,
                          clientWidth:document.querySelector('#experience').clientWidth};
                      });
                      assert.ok(foundation.contrast>=7,'Editorial foundation panel heading contrast: '+JSON.stringify(foundation));
                      assert.equal(foundation.position,'relative','Foundation left card must not be sticky');
                      assert.ok(foundation.left.w>0&&foundation.right.w>0,'Foundation cards must have nonzero width');
                      if(width>900){
                        assert.ok(Math.abs(foundation.left.w-foundation.right.w)<3,'Editorial Foundation cards must be balanced on desktop: '+JSON.stringify(foundation));
                        assert.ok(foundation.right.x>=foundation.left.x+foundation.left.w-2,'Foundation panels overlap on desktop: '+JSON.stringify(foundation));
                      }else{
                        assert.ok(foundation.right.y>=foundation.left.y+foundation.left.h-2,'Foundation panels must stack on mobile: '+JSON.stringify(foundation));
                      }
                      assert.ok(foundation.scrollWidth<=foundation.clientWidth+2,'Horizontal overflow within Foundation: '+JSON.stringify(foundation));

                      await page.locator('#ws-demo-jump').scrollIntoViewIfNeeded();
                      const collapsedHeight=await page.locator('#ws-inline-demo').evaluate(el=>el.getBoundingClientRect().height);
                      assert.ok(collapsedHeight<4,'Demo must occupy no height while closed: '+collapsedHeight);
                      await page.locator('#ws-demo-jump').click();
                      assert.equal(await page.locator('#ws-demo-jump').getAttribute('aria-expanded'),'true','Demo opener did not expand');
                      assert.equal(await page.locator('#ws-inline-demo').getAttribute('aria-hidden'),'false','Demo must become available to assistive tech');
                      assert.equal(await page.locator('#ws-inline-demo').evaluate(el=>el.inert),false,'Open demo must allow keyboard access');
                      await page.locator('#ws-demo-panel-1').waitFor({state:'visible'});
                      await page.waitForFunction(()=>document.querySelector('#ws-inline-demo').getBoundingClientRect().height>150,null,{timeout:1800});
                      const firstImage=page.locator('#ws-demo-panel-1 img');
                      await firstImage.evaluate(img=>img.decode());
                      assert.ok(await firstImage.evaluate(img=>img.naturalWidth>0),'Inline SVG image did not load');
                      await page.locator('#ws-demo-tab-2').click();
                      assert.equal(await page.locator('#ws-demo-panel-2').isVisible(),true,'Theme comparison chapter did not open');
                      await page.locator('#ws-demo-next').click();
                      assert.equal(await page.locator('#ws-demo-panel-3').isVisible(),true,'Walkthrough next button failed');
                      await page.locator('#ws-demo-previous').click();
                      assert.equal(await page.locator('#ws-demo-panel-2').isVisible(),true,'Walkthrough previous button failed');
                      await page.locator('#ws-demo-tab-1').click();

                      await page.locator('#ws-demo-close').click();
                      assert.equal(await page.locator('#ws-inline-demo').getAttribute('data-open'),'false','Close button must collapse demo');
                      assert.equal(await page.locator('#ws-demo-jump').getAttribute('aria-expanded'),'false');
                      assert.equal(await page.evaluate(()=>document.activeElement.id),'ws-demo-jump','Focus must return to opener');
                      await page.waitForFunction(()=>document.querySelector('#ws-inline-demo').getBoundingClientRect().height<4,null,{timeout:1800});
                      await page.locator('#ws-demo-jump').click();
                      await page.locator('#ws-demo-close').press('Escape');
                      assert.equal(await page.locator('#ws-inline-demo').getAttribute('data-open'),'false','Escape must collapse demo');
                      assert.equal(await page.evaluate(()=>document.activeElement.id),'ws-demo-jump','Escape must restore focus to opener');

                      const contrast=await page.evaluate(()=>{
                        const section=document.querySelector('section.capabilities');
                        const card=section.querySelector('.cap');
                        const heading=card.querySelector('h3');
                        const bg=getComputedStyle(card).backgroundColor;
                        const fg=getComputedStyle(heading).color;
                        const luminance=css=>{
                          const nums=css.match(/\d+(?:\.\d+)?/g).slice(0,3).map(Number).map(x=>x/255);
                          const a=nums.map(x=>x<=.04045?x/12.92:((x+.055)/1.055)**2.4);
                          return .2126*a[0]+.7152*a[1]+.0722*a[2];
                        };
                        const a=luminance(bg),b=luminance(fg);
                        return {ratio:(Math.max(a,b)+.05)/(Math.min(a,b)+.05),background:getComputedStyle(section).backgroundImage};
                      });
                      assert.ok(contrast.ratio>=7,'Editorial capabilities card text lacks contrast: '+JSON.stringify(contrast));
                      assert.match(contrast.background,/247,\s*242,\s*233/,'Editorial section must use warm light paper, not inherited dark green');
                    }
                    const snapshot=await page.evaluate(()=>{
                      const hero=document.querySelector('.hero');
                      const title=document.querySelector('.hero h1');
                      const portrait=document.querySelector('.hero-art .core');
                      const rect=node=>{const r=node.getBoundingClientRect();return {x:r.x,y:r.y,width:r.width,height:r.height}};
                      return {hero:rect(hero),title:rect(title),portrait:rect(portrait),overflow:document.documentElement.scrollWidth-innerWidth};
                    });
                    assert.ok(snapshot.hero.width>200&&snapshot.portrait.width>100,'Missing theme composition '+theme);
                    if(theme==='design-2'){
                      const orbit=await page.evaluate(()=>{
                        const a=document.querySelector('.hero-art').getBoundingClientRect();
                        const chips=[...document.querySelectorAll('.hero-art .ws-orbit-chip')];
                        const css=getComputedStyle(document.querySelector('.hero-art'));
                        const radius=parseFloat(css.getPropertyValue('--wf-orbit-size'))||0;
                        const centers=chips.map(el=>{
                          const r=el.getBoundingClientRect();
                          return {x:r.x+r.width/2-a.x-a.width/2,y:r.y+r.height/2-a.y-a.height/2};
                        });
                        const quick=document.querySelector('#ws-visitor-quick-open');
                        return {chips:centers,quickDocked:quick?.parentElement?.parentElement?.matches('.topbar .nav'),navX:document.querySelector('.topbar .nav').getBoundingClientRect().left,position:getComputedStyle(quick?.parentElement).position};
                      });
                      assert.equal(orbit.chips.length,4,'Cosmic needs four satellites');
                      assert.ok(orbit.quickDocked,'Quick Actions must be docked in header');
                      assert.notEqual(orbit.position,'fixed','Quick Actions must not obscure content');
                      assert.ok(orbit.navX>=10,'Brand is flush against viewport edge');
                      assert.ok(orbit.chips[0].x>0&&orbit.chips[0].y<0,'Top satellite angle incorrect');
                      assert.ok(orbit.chips[1].x>0&&orbit.chips[1].y>=0,'Right satellite angle incorrect');
                      assert.ok(orbit.chips[2].x<0&&orbit.chips[2].y>0,'Lower-left satellite angle incorrect');
                      assert.ok(orbit.chips[3].x>0&&orbit.chips[3].y>0,'Lower-right satellite angle incorrect');
                    }

                    assert.ok(snapshot.overflow<=3,'Horizontal overflow '+theme+'/'+width+': '+snapshot.overflow);
                    console.log('PASS visual geometry '+theme+' at '+width+'px',JSON.stringify(snapshot));
                  }
                  const overflow=await page.evaluate(()=>document.documentElement.scrollWidth-innerWidth);
                  assert.ok(overflow<=2,'Horizontal overflow '+width+': '+overflow);
                  console.log('PASS Chromium personal portal '+width+'px');
                }finally{await page.close();}
              }
            }finally{await browser.close();}
            JS


  browser-visual-regression:
    docker:
      - image: mcr.microsoft.com/playwright:v1.56.1-noble
    resource_class: medium
    steps:
      - checkout
      - run:
          name: Install pinned screenshot comparison dependencies
          command: |
            npm install --no-save --no-package-lock playwright@1.56.1 pngjs@7.0.0 pixelmatch@6.0.0
      - run:
          name: Editorial archived gold-master and 6-theme gallery in real Chromium
          no_output_timeout: 12m
          command: |
            set -eu
            node --check scripts/verify-editorial-visual.mjs
            node scripts/verify-editorial-visual.mjs
      - store_artifacts:
          path: visual-audit
          destination: editorial-gold-master-and-six-theme-gallery

workflows:
  validate-deployment-only-personal-portfolio:
    jobs:
      - public-artifact-integrity
      - browser-smoke:
          requires:
            - public-artifact-integrity
      - browser-visual-regression:
          requires:
            - public-artifact-integrity
